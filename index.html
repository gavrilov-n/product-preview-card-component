<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <div class="main-container">
    <div class="card">
      <picture>
        <source media="(max-width: 767px)" srcset="images/image-product-mobile.jpg">
        <img src="images/image-product-desktop.jpg" alt="card description">
      </picture>
    </div>
    <article class="product-overview">
      <h1 class="category">Perfume</h1>
      <h2 class="product">Gabrielle Essence Eau De Parfum</h2>
      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
      <div class="price">
        <p class="main-price">$149.99</p>
        <p class="old-price">$169.99</p>
      </div>
      <a href="#"><img src="images/icon-cart.svg" alt="shoping card icon"> Add to Cart</a>
    </article>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/gavrilov-n">Nikita Gavrilov</a>.
  </footer>
</body>
</html>
